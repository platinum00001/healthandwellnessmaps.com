<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map | Health &amp; Wellness Maps, Cape Cod</title>
<meta name="description" content="A free community map of wellness resources and free food on Cape Cod: food pantries, free meals, recovery support, mental health, fitness and more.">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M32 54s16-14 16-27a16 16 0 0 0-32 0c0 13 16 27 16 27z' fill='%23ecfdf5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--teal:#0f766e;--teal-d:#0b4f4a;--mint:#ecfdf5;--mint-2:#d1fae5;--ink:#0f2a2a;--muted:#4b6362;--coral:#fb7185;--line:#d6e7e3;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:#f7fbfa;font-size:15px;line-height:1.55;display:flex;flex-direction:column}
a{color:var(--teal)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--ink);text-decoration:none}.logo svg{width:30px;height:30px}.logo span{color:var(--teal)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,nav a{background:none;border:0;font:600 .9rem inherit;font-family:inherit;color:var(--ink);padding:8px 11px;border-radius:9px;cursor:pointer;text-decoration:none}
nav button:hover,nav button.on{background:var(--mint-2);color:var(--teal-d)}
.layout{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
#side{overflow:auto;background:#fff;border-right:1px solid var(--line);padding:16px}
#map{min-height:300px}
input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;font:inherit;padding:9px 11px;border-radius:9px;outline:none;color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:11px 0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border:0;border-radius:9px;padding:9px 14px;font:700 .88rem inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:.8rem}.btn.red{background:var(--red)}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--mint)}
.item b{display:block}
.muted{color:var(--muted)}.small{font-size:.82rem}
.free{background:#dcfce7;color:#166534;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px}
.stars{color:#f59e0b;letter-spacing:1px}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--mint-2)}
.pill.pending{background:#fef3c7;color:#92400e}.pill.rejected{background:#fee2e2;color:#991b1b}
.msg{margin-top:9px;font-size:.86rem;min-height:1.2em}.msg.err{color:var(--red)}.msg.ok{color:var(--teal)}
.review{border-top:1px solid var(--line);padding:10px 0}
.starpick button{background:none;border:0;font-size:1.5rem;color:#d1d5db;cursor:pointer}.starpick button.on{color:#f59e0b}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.box{background:var(--mint);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.crisis{font-size:.78rem;color:var(--muted);padding:8px 18px;background:#fff;border-top:1px solid var(--line)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
@media(max-width:820px){.layout{grid-template-columns:1fr;grid-template-rows:45vh auto}#map{order:-1}#side{border-right:0}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0f766e"/><path d="M32 54s16-14 16-27a16 16 0 0 0-32 0c0 13 16 27 16 27z" fill="#ecfdf5"/><path d="M32 20v14M25 27h14" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/></svg>Health &amp; Wellness <span>Maps</span></a>
  <nav id="nav"></nav>
</header>
<div class="layout"><aside id="side"><p class="muted">Loading…</p></aside><div id="map" role="region" aria-label="Map of wellness resources"></div></div>
<div class="crisis">Listings are community-submitted and reviewed; please call ahead to confirm hours. If you are in crisis, call or text 988 or dial 911.</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/config.js"></script>
<script src="/map/app.js"></script>
</body>
</html>
